[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.2.0
lib_extra_dirs = lib

; -----------------------------------------------------------------------
; Emulator build — no external wiring or sensors needed.
; Uses ESP32 internal GPIO loopback: Serial2 (driver) ↔ Serial1 (emulator)
; share the same pins, cross-wired via the GPIO matrix.
;
; Build:  pio run -e emulator
; Flash:  pio run -e emulator -t upload
; Monitor: pio device monitor
; -----------------------------------------------------------------------
[env:emulator]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D EMULATOR_MODE
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
lib_extra_dirs = lib
lib_ignore =
    OneWire
    DallasTemperature
